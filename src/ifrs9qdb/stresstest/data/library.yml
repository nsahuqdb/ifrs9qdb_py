  # ---------------------------------------------------- GCC and Qatar --
  - id: H5
    name: 2017 blockade of Qatar
    category: history
    region: qatar
    episode: [2017, 2019]
    window: [2013, 2021]
    source: IMF; PSA real estate price index
    description: >-
      A Qatar-specific shock: trade and transport links cut by neighbours,
      foreign funding withdrawn and property prices falling for three years.
    history: >-
      On 5 June 2017 Saudi Arabia, the UAE, Bahrain and Egypt cut diplomatic
      and trade links with Qatar and closed its land border and their
      airspace. Foreign financing and resident private deposits at Qatari
      banks fell by about 40 billion dollars, offset by injections from the
      central bank and the Qatar Investment Authority; the IMF judged the
      effect on activity transitory. The real estate price index fell 11% in
      2017 (IMF) and kept falling to 2019. The blockade ended with the Al-Ula
      declaration in January 2021.
    narrative: >-
      A confidence and trade shock that leaves world growth and oil
      untouched. Non-oil growth is 6.8, 3.6 and 3.7 points below the forecast in
      Y1-Y3; real government spending dips slightly, then rises 14 points in
      Y3 as the state supports the economy; property falls 9.9%, 2.6% and
      8.1%. Credit follows non-oil growth a year later.
    why:
      GOV_SPEND_QAT: Qatar's real spending growth in 2017-19 less its 2016
        growth.
      NONOIL_GDP_QAT: Qatar's non-oil growth in 2017-19 less its 2016 growth.
      PROPERTY_QAT: The PSA index's recorded change in 2017-19.
    book: >-
      The internal book through non-oil growth and property collateral.
    limits: >-
      The store's revised data show a sharper non-oil slowdown in 2017 than
      the IMF estimated at the time (about 4% growth). The deposit outflow is
      not a variable here; its effect reaches the book through non-oil growth
      and property.
    references:
      - title: Gulf News, Blockade impact on Qatar fading but risks remain (IMF, November 2018)
        url: https://gulfnews.com/business/economy/blockade-impact-on-qatar-fading-but-risks-remain-imf-1.2183794
      - title: IMF Press Release 18/202, Qatar 2018 Article IV
        url: https://www.imf.org/en/news/articles/2018/05/30/pr18202-qatar-2018-article-iv-consultation
      - title: IMF Press Release 19/192, Qatar 2019 Article IV
        url: https://imf.org/en/News/Articles/2019/06/03/pr19192-qatar-imf-executive-board-concludes-2019-article-iv-consultation-with-qatar
    main:
      GOV_SPEND_QAT: {how: change, base: 2016, years: [2017, 2018, 2019], values: [-3.88, -0.2, 14.02]}
      NONOIL_GDP_QAT: {how: change, base: 2016, years: [2017, 2018, 2019], values: [-6.83, -3.59, -3.65]}
      PROPERTY_QAT: {how: actual, years: [2017, 2018, 2019], values: [-9.9, -2.6, -8.1]}

  - id: H8
    name: 2016–20 Qatar property correction
    category: history
    region: qatar
    episode: [2016, 2020]
    window: [2011, 2023]
    source: PSA real estate price index
    description: >-
      Five years of falling property prices, about a quarter in all, with
      nothing else set: what collateral alone does to the provision.
    history: >-
      Qatar's real estate prices rose 82% over 2012-16, then fell 15% over
      2017-18 (IMF). The PSA index kept falling through the blockade and into
      the pandemic, about a quarter in all over 2016-20.
    narrative: >-
      Property prices fall 4.1%, 9.9%, 2.6%, 8.1% and 5.0% in Y1-Y5. Nothing
      else is set and no other variable is moved by property, so the
      scenario isolates the collateral channel: LGD rises where property
      backs a loan.
    why:
      PROPERTY_QAT: The PSA index's recorded change in each year of 2016-20.
    book: >-
      Collateral only: LGD on contracts secured by property.
    references:
      - title: IMF Press Release 19/192, Qatar 2019 Article IV
        url: https://imf.org/en/News/Articles/2019/06/03/pr19192-qatar-imf-executive-board-concludes-2019-article-iv-consultation-with-qatar
    main:
      PROPERTY_QAT: {how: actual, years: [2016, 2017, 2018, 2019, 2020], values: [-4.1, -9.9, -2.6, -8.1, -5]}

  - id: H9
    name: 1990–91 Gulf war
    category: history
    region: gcc
    episode: [1990, 1991]
    window: [1986, 1994]
    source: IMF World Economic Outlook
    tail: true
    description: >-
      A regional war: oil spikes then falls, Kuwait's output more than halves
      and activity across the Gulf is disrupted.
    history: >-
      Iraq invaded Kuwait on 2 August 1990. The oil price jumped, 28% higher
      on average in 1990, and fell back as the war ended in early 1991.
      Kuwait's output more than halved over 1990-91 and activity across the
      Gulf was disrupted; Qatar's real GDP fell 14.6% in 1990.
    narrative: >-
      Oil rises 28% against the forecast in Y1 and falls 15% in Y2. Qatar's
      real GDP growth is 19.9 and 6.8 points below the forecast, non-oil
      growth is given the same path, and GCC growth is 7.9 and 12.5 points
      below. The shock is far larger than anything the
      linked effects were estimated on, so their part is an extrapolation;
      the scenario is a tail case, not a central one.
    why:
      OIL_PRICE: The oil price's recorded change in 1990-91.
      GDP_QAT: Qatar's real GDP growth in 1990-91 less its 1989 growth.
      NONOIL_GDP_QAT: The same as Qatar's real GDP, since non-oil GDP was not
        measured then.
      GDP_GCC: The six countries' average growth in 1990-91 less their 1989
        growth.
    book: >-
      Every channel, the external book hardest.
    limits: >-
      Qatar's real GDP then was dominated by hydrocarbon output, so it
      overstates the non-oil shock.
    references:
      - title: Hamilton, Historical oil shocks, NBER Working Paper 16790
        url: https://www.nber.org/papers/w16790
    main:
      OIL_PRICE: {how: actual, years: [1990, 1991], values: [28.28, -15.33]}
      GDP_QAT: {how: change, base: 1989, years: [1990, 1991], countries: [QAT], values: [-19.94, -6.82]}
      NONOIL_GDP_QAT: {how: change, base: 1989, years: [1990, 1991], from: GDP_QAT, countries: [QAT], values: [-19.94, -6.82]}
      GDP_GCC: {how: change, base: 1989, years: [1990, 1991], countries: [QAT, SAU, ARE, KWT, OMN, BHR], values: [-7.89, -12.52]}

  - id: H10
    name: 2026 Iran war and Hormuz closure (IMF projection)
    category: current
    region: gcc
    episode: [2026, 2027]
    window: [2022, 2029]
    source: IMF World Economic Outlook, October 2026; QatarEnergy
    description: >-
      The war that began in February 2026 closed the Strait of Hormuz; the IMF
      projects Qatar's economy to shrink 15.6% in 2026 and rebound in 2027.
    history: >-
      The war began at the end of February 2026 and shipping through the
      Strait of Hormuz stopped in early March. On 18 March an Iranian strike
      on Ras Laffan put about 17% of Qatar's LNG capacity out of action for
      three to five years (QatarEnergy). The IMF's October 2026 outlook
      projects real GDP growth of -15.6% for Qatar in 2026 and +18.8% in 2027,
      with the GCC as a whole contracting 4.8% in 2026. It assumes the strait
      reopens gradually from March 2027 and returns to pre-war conditions by
      October 2027.
    narrative: >-
      Not a past episode: the IMF's own projection, replayed as if it hit
      again on top of the forecast. In Y1 LNG exports stop: Qatar's real GDP
      growth is 17.4 points below the forecast, oil 41% above it, non-oil
      growth 4.3 points below and GCC growth 11.3 points below. In Y2 the
      reopening brings output back: Qatar's real GDP growth 17.0 points
      above the forecast, oil down 9%, non-oil growth 2.5 points above and
      GCC growth 7.7 points above. The higher oil price supports government
      spending in Y1, which is why non-oil growth falls much less than total
      GDP.
    why:
      OIL_PRICE: The IMF's projected change in the oil price for 2026 and
        2027.
      GDP_QAT: Qatar's projected real GDP growth in 2026-27 less 2025's
        (-15.6% and +18.8% against 1.8%).
      NONOIL_GDP_QAT: Projected non-oil growth in 2026-27 less 2025's.
      GDP_GCC: The six countries' average projected growth in 2026-27 less
        their 2025 growth.
    book: >-
      The external book through GCC growth, of which Qatar's fall is part;
      the internal book through non-oil growth, which falls far less than
      total GDP because QDB's borrowers are outside oil and gas.
    limits: >-
      2026-27 are projections, not outturns. The run's own forecast may
      already contain part of this projection; the scenario then asks what a
      second shock of the same size would cost.
    references:
      - title: The National, IMF cuts 2026 growth forecasts for Gulf economies due to prolonged Hormuz closure (13 October 2026)
        url: https://www.thenationalnews.com/business/economy/2026/10/13/imf-cuts-2026-growth-forecasts-for-gulf-economies-due-to-prolonged-hormuz-closure/
      - title: World Oil, Iran strike could cut 17% of Qatar LNG capacity for up to five years (19 March 2026)
        url: https://www.worldoil.com/news/2026/3/19/iran-strike-could-cut-17-of-qatar-lng-capacity-for-up-to-five-years/
      - title: Zawya via TradingView, GCC economy faces 4.8% contraction in 2026, IMF says
        url: https://www.tradingview.com/news/reuters.com,2026-10-26:newsml_Zaw9SpZ3l:0-zawya-gcc-economy-faces-4-8-contraction-in-2026-imf-says/
    main:
      OIL_PRICE: {how: actual, years: [2026, 2027], values: [41.33, -8.71]}
      GDP_QAT: {how: change, base: 2025, years: [2026, 2027], countries: [QAT], values: [-17.39, 16.95]}
      NONOIL_GDP_QAT: {how: change, base: 2025, years: [2026, 2027], values: [-4.31, 2.54]}
      GDP_GCC: {how: change, base: 2025, years: [2026, 2027], countries: [QAT, SAU, ARE, KWT, OMN, BHR], values: [-11.32, 7.73]}

  - id: G1
    name: 2015–17 GCC fiscal austerity
    category: history
    region: gcc
    episode: [2015, 2017]
    window: [2011, 2020]
    source: IMF Saudi Arabia 2017 Article IV; IMF World Economic Outlook and Regional Economic Outlook
    description: >-
      A GCC-wide fiscal squeeze: governments cut capital spending and delay
      payments, contractors run short of cash and non-oil growth stalls.
    history: >-
      When oil revenue collapsed, GCC governments cut spending. Saudi Arabia,
      the largest, cut spending 6.4% in 2016, mainly capital spending, while
      settling arrears to contractors worth 3.3% of GDP. Delays in government
      payments pushed contractors onto their credit lines and accelerated the
      fall in bank deposits; three-month interbank rates rose to 2.4% in
      October 2016, credit growth was near zero, and Saudi non-oil growth fell
      to 0.2% (IMF). Across the six countries real spending fell about 9% in
      2015 and 3-4% in each of 2016 and 2017, after rising 6% in 2014. In 2017
      OPEC+ output cuts lowered GCC GDP.
    narrative: >-
      Oil is left at its forecast: the scenario isolates the fiscal channel.
      Qatar's real government spending grows 14.9, 9.8 and 9.7 points less
      than the forecast in Y1-Y3, as the GCC's did against 2014; non-oil growth
      is 0.5, 1.2 and 3.7 points lower, the GCC average slowdown; GCC growth
      holds up in Y1-Y2 and is 3.5 points lower in Y3. Credit and property
      follow non-oil activity. Capital-spending cuts matter most: GCC fiscal
      multipliers are 0.6 to 1.1 for capital spending against 0.3 to 0.7 for
      current spending (Espinoza and Senhadji).
    why:
      GOV_SPEND_QAT: The six GCC countries' average real spending growth in
        2015-17 less their 2014 growth, applied to Qatar.
      NONOIL_GDP_QAT: The six countries' average non-oil growth in 2015-17
        less their 2014 growth.
      GDP_GCC: The six countries' average growth in 2015-17 less their 2014
        growth.
    book: >-
      The internal book through non-oil growth, contractors and their
      suppliers first; the external book through GCC growth in Y3.
    limits: >-
      Payment delays and deposit outflows are not variables in the system;
      they reach the book only through non-oil growth.
    references:
      - title: IMF Country Report 17/316, Saudi Arabia 2017 Article IV Consultation
        url: https://www.imf.org/-/media/files/publications/cr/2017/cr17316.pdf
      - title: Espinoza and Senhadji, How strong are fiscal multipliers in the GCC? IMF WP/11/61
        url: https://ideas.repec.org/p/imf/imfwpa/2011-061.html
    main:
      GOV_SPEND_QAT: {how: change, base: 2014, years: [2015, 2016, 2017], countries: [QAT, SAU, ARE, KWT, OMN, BHR], values: [-14.88, -9.75, -9.69]}
      NONOIL_GDP_QAT: {how: change, base: 2014, years: [2015, 2016, 2017], countries: [QAT, SAU, ARE, KWT, OMN, BHR], values: [-0.49, -1.17, -3.65]}
      GDP_GCC: {how: change, base: 2014, years: [2015, 2016, 2017], countries: [QAT, SAU, ARE, KWT, OMN, BHR], values: [0.75, 0.35, -3.49]}

  - id: G2
    name: 2023–24 post-World Cup normalisation
    category: history
    region: qatar
    episode: [2023, 2024]
    window: [2019, 2026]
    source: IMF Qatar 2023 Article IV; PSA real estate price index
    description: >-
      The end of a mega-event cycle: construction and services slow after the
      World Cup, spending falls back and property softens.
    history: >-
      Qatar's economy boomed in 2022 with the FIFA World Cup and high
      hydrocarbon prices. Afterwards activity normalised: the IMF put
      non-hydrocarbon growth at 1.0% in 2023, down from 5.7% in 2022 (the
      store's revised data show 2.0%), non-resident deposits fell by more than
      a third from their peak, and the IMF warned that protracted weakness in
      real estate could hurt the banks. Real government spending fell in 2023
      and 2024 and property prices were flat, then fell 2.2% in 2024.
    narrative: >-
      Non-oil growth is 3.7 and 1.3 points below the forecast in Y1-Y2, real
      government spending 5.6 and 6.7 points lower, and property 0.9% higher,
      then 2.2% lower. World growth, oil and the GCC are untouched. Credit
      follows non-oil growth a year later. The same pattern would follow the
      end of any large project cycle, such as the North Field LNG expansion.
    why:
      GOV_SPEND_QAT: Qatar's real spending growth in 2023-24 less its 2022
        growth.
      NONOIL_GDP_QAT: Qatar's non-oil growth in 2023-24 less its 2022 growth.
      PROPERTY_QAT: The PSA index's recorded change in 2023-24.
    book: >-
      The internal book through non-oil growth: contractors, hospitality and
      services.
    references:
      - title: IMF Press Release 24/39, Qatar 2023 Article IV
        url: https://www.imf.org/en/news/articles/2024/02/07/pr2439-qatar-imf-executive-board-concludes-2023-article-iv-consultation
    main:
      GOV_SPEND_QAT: {how: change, base: 2022, years: [2023, 2024], values: [-5.56, -6.66]}
      NONOIL_GDP_QAT: {how: change, base: 2022, years: [2023, 2024], values: [-3.71, -1.28]}
      PROPERTY_QAT: {how: actual, years: [2023, 2024], values: [0.89, -2.23]}

  - id: G3
    name: 1982–86 oil glut
    category: history
    region: gcc
    episode: [1982, 1986]
    window: [1979, 1989]
    source: Gately (1986); IMF World Economic Outlook
    description: >-
      Lower for longer: five years of falling oil prices while GCC producers
      cut output to defend them, ending in the 1986 collapse.
    history: >-
      After the 1979-80 price peak, oil demand fell and supply from outside
      OPEC grew. OPEC defended its price by cutting output, Saudi Arabia most
      of all, and the price still fell every year from 1982 to 1985 before
      collapsing in 1986 (Gately, 1986). GCC output shrank with production:
      the six countries' average growth was -3.9% in 1982 and -2.2% in 1985,
      and Saudi Arabia's economy contracted 16% in 1982 and 11% in 1983.
    narrative: >-
      A slow-burning fiscal squeeze. Oil falls 11%, 9%, 4%, 4% and 48% in
      Y1-Y5, and GCC growth runs well below the forecast in most years. Lower
      revenue cuts Qatar's real spending year after year, which holds
      non-oil growth, credit and property below the forecast for the whole
      horizon. Unlike a sharp collapse, the damage builds slowly and does not
      reverse within five years.
    why:
      OIL_PRICE: The oil price's recorded change in each year of 1982-86.
      GDP_GCC: The average growth in 1982-86 of the GCC countries with data,
        less their 1981 growth.
    book: >-
      The external book through GCC growth for all five years; the internal
      book through non-oil growth as spending falls.
    limits: >-
      Qatar's non-oil GDP was not measured then, so it is filled by the
      linked effects. Kuwait has no 1981 figure, so the 1981 reference
      averages the other five.
    references:
      - title: Gately, Lessons from the 1986 oil price collapse, Brookings Papers on Economic Activity 1986(2)
        url: https://www.brookings.edu/articles/lessons-from-the-1986-oil-price-collapse/
    main:
      OIL_PRICE: {how: actual, years: [1982, 1983, 1984, 1985, 1986], values: [-10.83, -8.6, -3.49, -4.32, -48.08]}
      GDP_GCC: {how: change, base: 1981, years: [1982, 1983, 1984, 1985, 1986], countries: [QAT, SAU, ARE, KWT, OMN, BHR], values: [-9.25, -4.29, 1.23, -7.64, -5.96]}

  # ------------------------------------------------------- supervisory --
  - id: F1
    name: Fed 2026 severely adverse (global)
    category: supervisory
    region: global
    source: Board of Governors of the Federal Reserve System, 2026 stress test scenarios
    description: >-
      The Federal Reserve's severely adverse scenario for 2026: a severe
      global recession with US short rates falling to near zero.
    history: >-
      The Federal Reserve publishes its supervisory scenarios each February.
      The 2026 severely adverse scenario has a severe global recession, with
      output in advanced economies about 7.5% below the forecast and in
      developing Asia about 3%, and US short-term rates falling to near zero.
    narrative: >-
      World growth is 4.5 points below the forecast in Y1 and 1.0 point above in
      Y2; US rates are 3.6 points lower in Y1. Oil falls with world demand,
      cutting Qatar's real government spending; non-oil growth falls with
      world demand and spending, then credit and property. GCC growth falls
      with world demand and oil.
    translation: >-
      World GDP: the scenario's advanced-economy and developing-Asia output
      paths weighted by their shares of world output. US rate: the
      three-month Treasury rate's fall in year 1.
    why:
      GDP_WLD: The scenario's regional output paths translated to world GDP
        growth, as above.
      US_RATE: The scenario's three-month Treasury rate, year 1.
    book: >-
      Every channel, entirely through the linked effects: the scenario sets
      only global variables.
    references:
      - title: Federal Reserve, 2026 final supervisory stress test scenarios
        url: https://www.federalreserve.gov/publications/files/2026-final-supervisory-stress-test-scenarios-20260204.pdf
    main:
      GDP_WLD: {values: [-4.5, 1.0]}
      US_RATE: {values: [-3.6]}

