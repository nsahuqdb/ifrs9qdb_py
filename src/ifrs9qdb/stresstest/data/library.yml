# The scenario library: pre-built scenarios to price as they are or to copy
# and edit.
#
# Every number is a shock: a deviation from the forecast in the variable's
# own unit (growth rates and price changes in percentage points, the policy
# rate in points), in scenario years Y1 to Y5, Y1 being the first forecast
# year of the run it is priced on. A variable left out, or a year left
# blank, is filled by the linked effects (macro/system.py).
#
# Historical scenarios replay an episode from the macro store:
#   how: actual   the episode's own values: prices and rates, whose
#                 baseline change is the reference
#   how: change   the change from ``base``, the last year before the shock:
#                 growth rates, whose normal level is not zero
# ``countries`` averages a panel variable over those countries, ``from``
# replays another variable (a series the store does not have for that
# episode), and ``then`` appends fixed shocks after the derived ones.
# ``values`` holds the numbers derived on the store vintage named in
# ``derived_on``; ``check_library`` recomputes them on any vintage.
#
# The words: ``description`` is the one-line summary; ``history`` what
# happened; ``narrative`` the scenario as it would unfold from Y1; ``why``
# why each main variable is set and how its numbers were derived; ``book``
# how it reaches QDB's provision; ``limits`` what to keep in mind;
# ``references`` the sources. The linked variables' paths are explained on
# screen from the estimated equations.
schema_version: '2.0'
derived_on: v20261025-121333

scenarios:

  # ------------------------------------------------------------ global --
  - id: H1
    name: 1986 oil price war
    category: history
    region: global
    episode: [1986, 1988]
    window: [1982, 1991]
    source: Gately (1986); IMF World Economic Outlook
    description: >-
      A supply-driven oil collapse: a large producer floods the market to win
      back market share and the price halves within a year.
    history: >-
      From 1982 to 1985 Saudi Arabia cut its own output to hold up OPEC's
      price while other producers kept pumping. At the end of 1985 it changed
      course and raised output to win back market share. Crude fell to about
      12 dollars a barrel in the first half of 1986, its 1974 level in
      nominal terms (Gately, 1986). For 1986 as a whole the oil price was 48%
      lower, then 26% higher in 1987 and 19% lower in 1988. World growth
      barely moved in 1986: 3.4% against 3.7% in 1985. Its fall from 4.6% in
      1984 had already happened in 1985, before the price war, and growth
      picked up to 3.9% and 4.5% in 1987-88 as cheap oil helped importers.
      Qatar's real GDP, then mostly oil output, fell 13% in 1985 and grew 3.7%
      in 1986 (IMF WEO): the price war cut Qatar's revenue rather than its
      volumes.
    narrative: >-
      The price war is replayed from Y1. Oil falls by about half against the
      forecast in Y1, recovers a quarter in Y2 and falls a fifth again in Y3;
      later years follow world demand. Because the fall comes from supply,
      not from weak demand, world growth is a little below the forecast in Y1 and
      above it in Y2 and Y3, as in 1987-88. Qatar feels it through public
      finances: lower hydrocarbon revenue cuts real government spending in
      the same year and the next, which slows non-oil growth; credit and
      property follow a year behind, and Qatar's real GDP follows non-oil
      growth and the oil price. Nothing in Qatar is set directly.
    why:
      OIL_PRICE: The defining shock. The oil price's recorded change in each
        year of 1986-88.
      GDP_WLD: World growth in each year of 1986-88 less its growth in 1985,
        the last year before the price war. Most of the slowdown from 1984
        happened in 1985, so the 1986 shock is small.
    book: >-
      Mostly the internal book, through non-oil growth (the PD model) and then
      property collateral. GCC growth moves the external book only through
      its estimated link to oil.
    references:
      - title: Gately, Lessons from the 1986 oil price collapse, Brookings Papers on Economic Activity 1986(2)
        url: https://www.brookings.edu/articles/lessons-from-the-1986-oil-price-collapse/
    main:
      OIL_PRICE: {how: actual, years: [1986, 1987, 1988], values: [-48.08, 25.85, -18.91]}
      GDP_WLD: {how: change, base: 1985, years: [1986, 1987, 1988], values: [-0.29, 0.29, 0.87]}

  - id: H2
    name: 1998 oil slump (Asian crisis)
    category: history
    region: global
    episode: [1998, 1999]
    window: [1994, 2002]
    source: IMF World Economic Outlook
    description: >-
      Emerging-market turmoil cuts oil demand just as producers add supply:
      oil falls by a third and world growth slows.
    history: >-
      The Asian financial crisis of 1997-98 cut oil demand in Asia just as
      OPEC, meeting in Jakarta in November 1997, raised its output ceiling.
      The oil price fell by about a third in 1998, Brent briefly close to 10
      dollars a barrel, and recovered in 1999 after OPEC and other producers
      cut output. World growth slowed from 4.0% in 1997 to 2.6% in 1998 and
      was 3.6% in 1999.
    narrative: >-
      A demand shock that meets extra supply. In Y1 oil falls by a third
      against the forecast and world growth is 1.4 points lower; in Y2 oil
      rebounds by 37% while world growth is still 0.5 points lower. Lower
      revenue cuts Qatar's real government spending, lower world demand and
      spending slow non-oil growth, and credit and property follow.
    why:
      OIL_PRICE: The oil price's recorded change in 1998 and 1999.
      GDP_WLD: World growth in 1998-99 less its growth in 1997.
    book: >-
      The internal book through non-oil growth and collateral; the external
      book through GCC growth's links to world demand and oil.
    references:
      - title: Bloomberg via Gulf News, Emerging-markets turmoil revives a dreaded old OPEC ghost (2018), on Jakarta 1997
        url: https://gulfnews.com/business/sectors/markets/emerging-markets-turmoil-revives-a-dreaded-old-opec-ghost-1.2268012
    main:
      OIL_PRICE: {how: actual, years: [1998, 1999], values: [-31.6, 37.35]}
      GDP_WLD: {how: change, base: 1997, years: [1998, 1999], values: [-1.44, -0.48]}

  - id: H3
    name: 2009 global financial crisis
    category: history
    region: global
    episode: [2009, 2010]
    window: [2005, 2013]
    source: IMF World Economic Outlook and Regional Economic Outlook; IMF Monetary and Financial Statistics; BIS policy rates
    description: >-
      A global financial crisis: world output falls, oil collapses, the Fed
      cuts to zero and the Gulf's credit boom ends.
    history: >-
      After Lehman Brothers failed in September 2008, world output fell in
      2009, the oil price dropped by a third and the Federal Reserve cut its
      rate to near zero. In the Gulf the credit boom of 2005-08 ended. Dubai's
      property bubble burst in mid-2008 and Dubai World sought a debt
      standstill in November 2009; real credit to the UAE's private sector
      was flat in 2009 (IMF). In Qatar the state supported its banks: the
      Qatar Investment Authority took stakes of up to 20% in the listed banks,
      and the government bought the banks' real estate and listed-equity
      portfolios (MEED). Qatar's own non-oil economy kept growing on LNG and
      infrastructure investment.
    narrative: >-
      A world demand collapse with a regional credit crunch. In Y1 world
      growth is 3.3 points below the forecast and oil 36% lower, with a 2.3-point
      rebound in world growth and a 29% oil recovery in Y2; US rates fall 1.7
      points. Non-oil growth is 3.7 and 2.9 points below the forecast. Real credit
      growth falls 15.6 and 26.3 points below its pre-crisis pace, the
      sharpest credit shock in the library, and GCC growth is 6.1 and 1.6
      points lower. Property falls with non-oil activity and credit.
    why:
      OIL_PRICE: The oil price's recorded change in 2009 and 2010.
      GDP_WLD: World growth in 2009-10 less its growth in 2008.
      US_RATE: The recorded change in the annual average policy rate.
      NONOIL_GDP_QAT: The average non-oil growth of Saudi Arabia, the UAE,
        Kuwait, Oman and Bahrain in 2009-10 less their 2008 growth. Qatar's own
        non-oil growth kept rising on LNG investment and would hide the shock.
      CREDIT_QAT: Qatar's real credit growth in 2009-10 less its 2008 growth.
      GDP_GCC: The six countries' average growth in 2009-10 less their 2008
        growth.
    book: >-
      Every channel: non-oil growth (internal PD), GCC growth (external PD),
      stage moves, and property collateral, which the credit fall pushes
      down.
    references:
      - title: IMF Public Information Notice 10/20, United Arab Emirates 2009 Article IV
        url: https://www.imf.org/en/News/Articles/2015/09/28/04/53/pn1020
      - title: MEED, Qatari state support stabilises lenders
        url: https://www.meed.com/qatari-state-support-stabilises-lenders/
      - title: Espinoza and Prasad, Nonperforming loans in the GCC banking system and their macroeconomic effects, IMF WP/10/224
        url: https://www.imf.org/external/pubs/ft/wp/2010/wp10224.pdf
    main:
      OIL_PRICE: {how: actual, years: [2009, 2010], values: [-36.44, 28.69]}
      GDP_WLD: {how: change, base: 2008, years: [2009, 2010], values: [-3.28, 2.34]}
      US_RATE: {how: actual, years: [2009, 2010], values: [-1.74, 0]}
      NONOIL_GDP_QAT: {how: change, base: 2008, years: [2009, 2010], countries: [SAU, ARE, KWT, OMN, BHR], values: [-3.74, -2.9]}
      CREDIT_QAT: {how: change, base: 2008, years: [2009, 2010], values: [-15.57, -26.33]}
      GDP_GCC: {how: change, base: 2008, years: [2009, 2010], countries: [QAT, SAU, ARE, KWT, OMN, BHR], values: [-6.07, -1.57]}

  - id: H4
    name: 2015–16 oil collapse
    category: history
    region: global
    episode: [2015, 2017]
    window: [2011, 2020]
    source: IMF World Economic Outlook and Regional Economic Outlook; PSA real estate price index
    description: >-
      A supply-driven oil collapse with world growth steady: Qatar cuts
      spending and its non-oil growth slows.
    history: >-
      OPEC decided not to cut output in November 2014. Brent fell from over
      100 dollars a barrel in mid-2014 to under 30 in early 2016 while world
      growth held at about 3.5%. Qatar moved into fiscal deficit, 9.2% of GDP
      in 2016, cut spending and reprioritised projects, and its non-oil growth
      slowed (IMF). Real estate prices, up 53% over 2013-16, fell 11% in 2017
      (IMF). GCC output held up as producers pumped more.
    narrative: >-
      Oil falls 47% against the forecast in Y1 and a further 15% in Y2, then
      recovers 22% in Y3, with world growth almost unchanged. Qatar's real
      government spending grows about 20 points less than in the year before
      the collapse, for two years, and non-oil growth is 1.5 and 4.7 points
      lower. Property still rises in Y1, as the boom carried into 2015, falls
      4% in Y2 and then follows non-oil activity down. GCC growth is little
      changed.
    why:
      OIL_PRICE: The oil price's recorded change in 2015-17.
      GDP_WLD: World growth in 2015-17 less its growth in 2014.
      GOV_SPEND_QAT: Qatar's real spending growth in 2015-16 less its 2014
        growth.
      NONOIL_GDP_QAT: Qatar's non-oil growth in 2015-16 less its 2014 growth.
      PROPERTY_QAT: The PSA index's recorded change in 2015-16.
      GDP_GCC: The six countries' average growth in 2015-16 less their 2014
        growth.
    book: >-
      The internal book through non-oil growth; collateral once property
      turns down in Y2.
    limits: >-
      Credit is left to the linked effects: Qatar's credit growth rose in
      2015, which is not part of the shock.
    references:
      - title: Khandelwal, Miyajima and Santos, The impact of oil prices on the banking system in the GCC, IMF WP/16/161
        url: https://ideas.repec.org/p/imf/imfwpa/2016-161.html
      - title: IMF Press Release 18/202, Qatar 2018 Article IV
        url: https://www.imf.org/en/news/articles/2018/05/30/pr18202-qatar-2018-article-iv-consultation
      - title: Gulf News, Blockade impact on Qatar fading but risks remain (IMF, 2018)
        url: https://gulfnews.com/business/economy/blockade-impact-on-qatar-fading-but-risks-remain-imf-1.2183794
    main:
      OIL_PRICE: {how: actual, years: [2015, 2016, 2017], values: [-47.15, -15.02, 22.45]}
      GDP_WLD: {how: change, base: 2014, years: [2015, 2016, 2017], values: [-0.11, -0.34, 0.29]}
      GOV_SPEND_QAT: {how: change, base: 2014, years: [2015, 2016], values: [-21.64, -19.32]}
      NONOIL_GDP_QAT: {how: change, base: 2014, years: [2015, 2016], values: [-1.49, -4.72]}
      PROPERTY_QAT: {how: actual, years: [2015, 2016], values: [14.5, -4.1]}
      GDP_GCC: {how: change, base: 2014, years: [2015, 2016], countries: [QAT, SAU, ARE, KWT, OMN, BHR], values: [0.75, 0.35]}

  - id: H6
    name: 2020 COVID-19 pandemic
    category: history
    region: global
    episode: [2020, 2021]
    window: [2016, 2023]
    source: IMF World Economic Outlook and Regional Economic Outlook; BIS policy rates; PSA real estate price index; QDB loan data
    restructured: 0.72
    description: >-
      A pandemic: lockdowns, an oil price war, near-zero US rates and a
      payment-deferral programme that moves most performing borrowers to
      Stage 2.
    history: >-
      Lockdowns closed much of the world economy in 2020. Saudi Arabia and
      Russia fought a price war in March as demand collapsed, and the oil
      price fell by a third for the year. The Federal Reserve cut to near
      zero. On 15 March 2020 Qatar announced a QR75 billion package for the
      private sector; the central bank was asked to help banks postpone
      instalments for six months, and QDB was directed to defer instalments
      for all its borrowers for six months (The Peninsula). In QDB's loan data
      72-75% of performing Stage 1 borrowers moved to Stage 2 within a year,
      mostly through deferrals and maturity extensions.
    narrative: >-
      Y1 is a deep, broad shock: world growth 5.7 points below the forecast, oil
      32% lower, US rates 1.75 points lower, Qatar's real government spending
      18.9 points lower, non-oil growth 5.4 points lower, property 5% lower
      and GCC growth 6.0 points lower, and a deferral programme moves 72% of
      Stage 1 borrowers to Stage 2. Y2 rebounds: world growth 3.7 points above
      the forecast, oil up 66% and non-oil growth slightly above, while real
      credit growth slows 9.5 points.
    why:
      OIL_PRICE: The oil price's recorded change in 2020-21.
      GDP_WLD: World growth in 2020-21 less its growth in 2019.
      US_RATE: The recorded change in the annual average policy rate.
      GOV_SPEND_QAT: Qatar's real spending growth in 2020-21 less its 2019
        growth.
      NONOIL_GDP_QAT: Qatar's non-oil growth in 2020-21 less its 2019 growth.
      CREDIT_QAT: Qatar's real credit growth in 2020-21 less its 2019 growth.
      PROPERTY_QAT: The PSA index's recorded change in 2020-21.
      GDP_GCC: The six countries' average growth in 2020-21 less their 2019
        growth.
      restructured: The share of performing Stage 1 borrowers who moved to
        Stage 2 within twelve months in QDB's 2019-2020 monthly cohorts.
    book: >-
      The deferral programme dominates: about two thirds of the cost is stage
      moves, the rest the PD model.
    references:
      - title: The Peninsula, Qatar announces QR75bn stimulus for private sector (16 March 2020)
        url: https://thepeninsulaqatar.com/article/16/03/2020/Qatar-announces-QR75bn-stimulus-for-private-sector
    main:
      OIL_PRICE: {how: actual, years: [2020, 2021], values: [-32.01, 65.81]}
      GDP_WLD: {how: change, base: 2019, years: [2020, 2021], values: [-5.68, 3.71]}
      US_RATE: {how: actual, years: [2020, 2021], values: [-1.75, -0.25]}
      GOV_SPEND_QAT: {how: change, base: 2019, years: [2020, 2021], values: [-18.94, -5.92]}
      NONOIL_GDP_QAT: {how: change, base: 2019, years: [2020, 2021], values: [-5.36, 0.72]}
      CREDIT_QAT: {how: change, base: 2019, years: [2020, 2021], values: [-1.57, -9.48]}
      PROPERTY_QAT: {how: actual, years: [2020, 2021], values: [-5, 2.04]}
      GDP_GCC: {how: change, base: 2019, years: [2020, 2021], countries: [QAT, SAU, ARE, KWT, OMN, BHR], values: [-6.02, 2.43]}

  - id: H7
    name: 2022–23 Fed tightening
    category: history
    region: global
    episode: [2022, 2023]
    window: [2018, 2025]
    source: BIS central bank policy rates
    description: >-
      The fastest US rate rise in four decades, followed by Qatar through the
      dollar peg.
    history: >-
      The Federal Reserve raised its rate from near zero in March 2022 to
      5.25-5.5% by July 2023, and Qatar's central bank moved with it under
      the peg. The annual average US rate rose 1.8 points in 2022 and 3.2
      points in 2023.
    narrative: >-
      US rates are 1.8 points above the forecast in Y1 and rise a further 3.2
      points in Y2, then stay there. Higher financing costs trim GCC
      government spending and, slightly, credit; non-oil growth eases through
      spending, and property follows. Nothing else is set.
    why:
      US_RATE: The recorded change in the annual average policy rate in 2022
        and 2023.
    book: >-
      Small: rates reach the book only through spending and activity.
    limits: >-
      QDB's own default history shows no direct link from rates to defaults
      (tested on the codex-method series and dropped), so there is no
      separate rate channel.
    references:
      - title: Adedeji, Roos, Shahid and Zhu, U.S. monetary policy spillovers to GCC countries, IMF WP/19/304
        url: https://imf.org/-/media/Files/Publications/WP/2019/wpiea2019304-print-pdf.ashx
    main:
      US_RATE: {how: actual, years: [2022, 2023], values: [1.77, 3.21]}

  - id: H11
    name: 2001 global slowdown
    category: history
    region: global
    episode: [2001, 2002]
    window: [1997, 2005]
    source: IMF World Economic Outlook; BIS policy rates
    description: >-
      A global slowdown after a boom: world growth falls by half, oil eases
      and the Fed cuts by more than four points.
    history: >-
      The end of the dot-com boom and the attacks of 11 September 2001 slowed
      the world economy: world growth fell from 4.8% in 2000 to 2.5% in 2001.
      The oil price fell 14% and the Federal Reserve cut its rate from 6.5%
      to 1.75% during 2001.
    narrative: >-
      World growth is 2.3 points below the forecast in Y1 and 2.0 in Y2, oil 14%
      lower in Y1, and US rates 2.5 and 2.1 points lower. The demand shock
      reaches Qatar through world demand and, via oil, spending; lower rates
      soften it slightly.
    why:
      OIL_PRICE: The oil price's recorded change in 2001-02.
      GDP_WLD: World growth in 2001-02 less its growth in 2000.
      US_RATE: The recorded change in the annual average policy rate.
    book: >-
      The internal book through non-oil growth, the external book through
      GCC growth's link to world demand.
    references:
      - title: IMF, World Economic Outlook December 2001, The global economy after September 11
        url: https://www.imf.org/en/Publications/WEO/Issues/2016/12/30/World-Economic-Outlook-December-2001-Special-Issue-The-Global-Economy-After-September-11-15458
      - title: Hamilton, Historical oil shocks, NBER Working Paper 16790
        url: https://www.nber.org/papers/w16790
    main:
      OIL_PRICE: {how: actual, years: [2001, 2002], values: [-13.98, 2.09]}
      GDP_WLD: {how: change, base: 2000, years: [2001, 2002], values: [-2.32, -1.97]}
      US_RATE: {how: actual, years: [2001, 2002], values: [-2.54, -2.06]}

