# Stress testing parameters: how a macro scenario reaches the provision.
#
# Read by the stress screens only. The booked provision never reads this
# file, so nothing here can change a run's ECL. A copy in the project's
# config/ folder (config/stress.yml) overrides this default and is frozen
# with the config like any other file, so a stress result can always be
# traced to the parameters that produced it.
#
# How a scenario's other variables move with its main ones (the linked
# effects) is estimated from the macro store each time: macro/data/system.yml.
schema_version: '2.0'

# Forecast years a scenario covers: the PD model's forecast years. Later
# years revert as the PD chain reverts.
horizon_years: 5

# 1. PD model. The run's own models move the PD curves (rebuilt by
# stress.pd_chain). Which scenario variable reaches the internal model, and
# its slope, are the model's own, read from the run's model.yml: its main
# variable (the largest weight), the system variable the catalogue links to
# it (model_variable), and its coefficient -- nothing about the model is
# copied here. What is the stress test's own:
#   external  the system variable each GCC country's growth follows in the
#             external model
#   range     the slope's range the sensitivity screen prices a scenario at:
#             QDB's yearly default rates 2014-2024 (the codex method's
#             portfolio) put the V4 slope on non-oil growth between -0.019
#             and -0.048 a point (the model's: -0.0414, standard error
#             0.0178). Re-estimate it when the model is recalibrated.
pd_link:
  external: GDP_GCC
  range: [-0.019, -0.048]

# 2. Stage moves. A Stage 1 contract moves to Stage 2 within a year with
# probability p12 in a normal year. A scenario moves that probability
# through the same one-factor model as default, scaled by how strongly each
# rate follows the common factor:
#   p12' = Phi(Phi^-1(p12) + k x dz),
#   k    = sqrt(rho_stage / (1 - rho_stage)) / sqrt(rho_default / (1 - rho_default))
# with dz the probit change of the contract's 12-month PD. Each extra share
# moving costs its lifetime ECL less its 12-month ECL. All three numbers
# come from QDB's loan data, stages rebuilt from arrears, maturity
# extensions and QCB grades (79% agreement with the booked stages).
staging:
  p12: 0.063          # Stage 1 to 2 within a year outside COVID: 3.8% (Dec 2024 to Dec 2025), 8.8% (Sep 2025 to Sep 2026)
  rho_stage: 0.033    # how strongly the yearly Stage 1 to 2 rate follows the common factor (monthly cohorts outside COVID)
  rho_default: 0.032  # the same for the default rate
  # the external book's stages are not QDB's borrowers' and are left alone
  internal_only: true

# 3. Collateral. A collateral type whose description matches moves with the
# variable: by the lowest point its cumulative level reaches over the
# horizon (a 15% fall then a 10% fall is about -23.5%; a rise is left out).
collateral:
  PROPERTY_QAT: "(?i)property|land|real estate|building|villa|mortgage"

# ECL at risk and reverse stress. Each path is priced from the book's own
# decomposition (the provision is linear in each year's default
# probability), with the PD chain rebuilt on a grid of driver moves; the
# library is checked against full repricing every time.
risk:
  paths: 2000
  seed: 20261027
  percentiles: [95, 99]
  default_draws: true      # draw customer defaults in each path (concentration)
  driver_grid: [-25.0, -20.0, -15.0, -10.0, -8.0, -6.0, -4.0, -3.0, -2.0, -1.0, -0.5, 0.0, 0.5, 1.0, 2.0, 3.0, 4.0, 6.0, 8.0]
